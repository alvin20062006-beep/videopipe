<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VideoPipe 视频链接下载工具">
  <title>VideoPipe</title>
  <link rel="icon" href="/videopipe-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14"/></symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3ZM6 14l.8 2.2L9 17l-2.2.8L6 20l-.8-2.2L3 17l2.2-.8L6 14Zm11-1 1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3Z"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10.6 13.4a2 2 0 0 0 2.8 0l3-3a2 2 0 0 0-2.8-2.8l-1.2 1.2m1 1.8a2 2 0 0 0-2.8 0l-3 3a2 2 0 0 0 2.8 2.8l1.2-1.2"/></symbol>
    <symbol id="icon-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3V9Z"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.1 8A7 7 0 0 1 18 6l2 6M18 16a7 7 0 0 1-11.9 2L4 12"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m6 12 4 4 8-9"/></symbol>
  </svg>
  <header class="header">
    <a class="brand" href="/" aria-label="VideoPipe 首页">
      <img src="/videopipe-mark.svg" alt="">
      <span>VideoPipe</span>
    </a>
    <nav aria-label="主导航">
      <a class="active" href="#downloader"><svg class="icon"><use href="#icon-download"/></svg>下载器</a>
      <span class="nav-ai" aria-label="视频 AI 转换，即将推出" aria-disabled="true"><svg class="icon"><use href="#icon-sparkles"/></svg><span>视频 AI 转换</span><small>即将推出</small></span>
    </nav>
  </header>

  <main id="downloader">
    <section class="intro">
      <h1>粘贴链接，下载视频</h1>
      <p>支持常见视频平台与媒体链接</p>
      <form id="analyze-form" class="link-form">
        <div class="input-shell">
          <label class="sr-only" for="link-input">视频链接或分享文本</label>
          <svg class="icon link-icon" aria-hidden="true"><use href="#icon-link"/></svg>
          <input id="link-input" autocomplete="url" placeholder="粘贴视频链接或分享文本" required>
          <button id="clear-button" class="clear-button" type="button" aria-label="清空链接" hidden>×</button>
        </div>
        <button id="analyze-button" type="submit">解析视频</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section id="result" class="result" hidden aria-label="解析结果">
      <button id="preview-button" class="thumbnail-wrap" type="button" aria-label="预览视频">
        <img id="thumbnail" alt="视频封面">
        <span id="thumbnail-duration"></span>
        <span class="preview-label">点击预览</span>
      </button>
      <div class="video-info">
        <h2 id="video-title"></h2>
        <div class="meta"><span><svg class="icon"><use href="#icon-video"/></svg><i id="platform"></i></span><span><svg class="icon"><use href="#icon-clock"/></svg><i id="duration"></i></span></div>
        <h3>选择画质</h3>
        <div id="qualities" class="qualities"></div>
        <div id="alternatives" class="alternatives" hidden></div>
      </div>
      <div class="result-actions">
        <button id="download-button" class="primary"><svg class="icon"><use href="#icon-download"/></svg>下载到本地</button>
        <button id="reset-button" class="secondary"><svg class="icon"><use href="#icon-refresh"/></svg>重新解析</button>
      </div>
    </section>

    <section id="tasks" class="tasks" hidden>
      <h2>当前任务 · <span id="task-count">0</span></h2>
      <div id="job-list" class="job-list"></div>
    </section>

  </main>

  <dialog id="preview-dialog" aria-label="视频预览">
    <button id="close-preview" type="button" aria-label="关闭预览">×</button>
    <video id="preview-video" controls playsinline></video>
    <p id="preview-message" role="status"></p>
  </dialog>

  <script src="/hls.min.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
